modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "brushablecompat"
version = "1.0.0"
displayName = "Brushable Block Family Compat"
description = '''
Fixes the startup crash "Given block ... does not derive from existing
valid block's common superclass" that happens when one mod replaces
vanilla BrushableBlock instances with its own subclass (e.g. Zero Point
System) while another mod registers additional brushable-family blocks
via BlockEntityTypeAddBlocksEvent (e.g. Wetland Whimsy's suspicious_mud).

This is a standalone compatibility patch: it does not depend on either
mod and only relaxes NeoForge's check for the BrushableBlock family
specifically, leaving every other use of that check untouched.
'''
authors = "you"

[[dependencies.brushablecompat]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.brushablecompat]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"
